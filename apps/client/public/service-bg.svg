<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="glowRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3c00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#220000" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="bgFade" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgFade)" />

  <!-- Glow rectangle on right -->
  <rect x="1300" y="100" width="500" height="880" fill="#ff3c00" opacity="0.05"/>

  <!-- Wavy lines -->
  <path d="M0,200 C300,100 600,300 900,200 S1500,300 1920,200 L1920,1080 L0,1080 Z" fill="url(#glowRed)" opacity="0.9"/>
  <path d="M0,300 C300,200 600,400 900,300 S1500,400 1920,300 L1920,1080 L0,1080 Z" fill="url(#glowRed)" opacity="0.6"/>
  <path d="M0,400 C300,300 600,500 900,400 S1500,500 1920,400 L1920,1080 L0,1080 Z" fill="url(#glowRed)" opacity="0.4"/>
  <path d="M0,500 C300,400 600,600 900,500 S1500,600 1920,500 L1920,1080 L0,1080 Z" fill="url(#glowRed)" opacity="0.2"/>
</svg>